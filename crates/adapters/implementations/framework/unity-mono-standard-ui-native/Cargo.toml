[package]
name = "glyphshift-adapter-unity-mono-standard-ui-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
glyphshift-adapter-native-abi = { path = "../../../platform/native-abi" }
glyphshift-adapter-unity-mono-standard-ui = { path = "../unity-mono-standard-ui" }
glyphshift-adapter-unity-standard-ui = { path = "../unity-standard-ui" }
retour = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_LibraryLoader", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "allow"
