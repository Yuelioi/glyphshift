[package]
name = "glyphshift-adapter-qt-text-document-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
glyphshift-adapter-native-abi = { path = "../../../platform/native-abi" }
glyphshift-adapter-qt-text-document = { path = "../qt-text-document" }
retour = { version = "0.3", features = ["thiscall-abi"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[lints.rust]
unsafe_code = "allow"
