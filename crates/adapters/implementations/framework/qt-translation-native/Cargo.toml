[package]
name = "glyphshift-adapter-qt-translation-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = []
research-qt5 = []

[dependencies]
glyphshift-adapter-native-abi = { path = "../../../platform/native-abi" }
glyphshift-adapter-qt-translation = { path = "../qt-translation" }
retour = { version = "0.3", features = ["thiscall-abi"] }

[dependencies.windows]
version = "0.58"
features = ["Win32_System_LibraryLoader"]

[lints.rust]
unsafe_code = "allow"
